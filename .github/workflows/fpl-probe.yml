name: fpl-probe

# SEMENTARA: uji apakah API FPL bisa diakses dari runner GitHub (IP datacenter). Akan dihapus.
on:
  push:
    branches: [phase-1]
    paths: [".github/workflows/fpl-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil endpoint FPL
        run: |
          for e in bootstrap-static/ fixtures/ event-status/ event/7/live/ element-summary/430/; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -A 'TaktikFPL/0.1 (personal use)' "https://fantasy.premierleague.com/api/$e")
            echo "$e -> HTTP $code, $(wc -c < /tmp/out) byte"
            [ "$code" = "200" ] || exit 1
          done
      - name: CDN foto & dataset historis
        run: |
          curl -sf -o /dev/null https://resources.premierleague.com/premierleague25/photos/players/110x140/154561.png
          curl -sf -o /dev/null https://raw.githubusercontent.com/vaastav/Fantasy-Premier-League/master/data/master_team_list.csv
          echo ok
