name: backup-gdrive

# Backup mingguan DB + arsip ke Google Drive (docs/adr/0002-worker-github-actions.md).
# Struktur di Drive: TaktikFPL-backup/db/<waktu>/ (snapshot, disimpan 8 minggu)
#                    TaktikFPL-backup/archive/... (cermin arsip permanen, tidak pernah dihapus)
on:
  schedule:
    - cron: "0 3 * * 0" # Minggu 03:00 UTC = 10:00 WIB
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-gdrive
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: production
      ARCHIVE_BACKEND: supabase
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GDRIVE_DIR: TaktikFPL-backup
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/worker/uv.lock
      - working-directory: services/worker
        run: uv sync --frozen --no-dev

      - name: Pasang rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Konfigurasi rclone (remote "gdrive")
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone lsd gdrive: --max-depth 1 > /dev/null

      - name: Daftar arsip yang sudah ada di Drive
        run: rclone lsf -R --files-only "gdrive:$GDRIVE_DIR/archive" > "$RUNNER_TEMP/existing.txt" || true

      - name: Backup DB + arsip baru
        working-directory: services/worker
        run: >
          uv run python -m app.backup --dest "$RUNNER_TEMP/backup" --keep 0
          --archive-skip-list "$RUNNER_TEMP/existing.txt"

      - name: Unggah ke Google Drive
        run: rclone copy "$RUNNER_TEMP/backup" "gdrive:$GDRIVE_DIR" --exclude backup.log

      - name: Rotasi snapshot DB lebih tua dari 8 minggu
        run: |
          rclone delete "gdrive:$GDRIVE_DIR/db" --min-age 57d
          rclone rmdirs "gdrive:$GDRIVE_DIR/db" --leave-root
