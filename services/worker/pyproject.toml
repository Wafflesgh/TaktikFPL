[project]
name = "taktikfpl-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "apscheduler>=3.10,<4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "tenacity>=8.5",
  "structlog>=24.1",
  "pyjwt[crypto]>=2.9",
  "redis>=5.0",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "pulp>=2.9",
  "google-genai>=1.0",
  "feedparser>=6.0",
  "rapidfuzz>=3.9",
  "pywebpush>=2.0",
  "sentry-sdk>=2.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() di default argumen

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
